schema_version: "1.1"
name: ux-on-spec
description: A user-journey question about a feature spec fires the UX perspective.
tags: [triggering]
runs: 3
execution:
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Check the partner's user journey in this feature spec: can a partner actually get from signing up to a working export without contacting support?

    # Spec: partner usage export

    ## Functional behaviour
    Partners call `GET /export` on the API gateway. The gateway calls the export
    service, which queries the ledger database and returns a CSV of the partner's
    customers' usage for the previous day. Partners authenticate with an API key
    sent in a query parameter.

    ## Non-functional
    - Gateway timeout: 2 seconds. Export service retries the database 3 times.
    - Logs go to the shared log store.

graders:
  - name: ux-fires
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?spec-review-ux"'
