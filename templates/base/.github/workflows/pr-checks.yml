# pr-checks.yml: decision 0004. Calls the reusable check in
# blairforce1/.github, which refuses a malformed title, a process: title
# without a Record line, an unanswered Checks box, undeclared generated
# content, a missing or dangling Change: line, and anything but one class:*
# label, and keeps the protected-path label in step with .github/CODEOWNERS.
# With .github/risk.yml (decision 0016) it also sets a risk:* label, keeps
# the review-focus comment and removes owner-reviewed on a push.
# `edited` re-runs it when the body is fixed, `labeled` and `unlabeled`
# when the class or owner-reviewed label is. pull-requests: write is for
# those labels and the comment only.
name: pr-checks

on:
  pull_request:
    types: [
      opened,
      edited,
      reopened,
      synchronize,
      ready_for_review,
      labeled,
      unlabeled,
    ]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-checks:
    uses: blairforce1/.github/.github/workflows/pr-checks.yml@main
