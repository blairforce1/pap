  <!-- wordmark -->
  <g font-family="Open Sans">
    <text x="620" y="285" font-size="150" font-weight="800" fill="#a9a9a9" letter-spacing="4">PAP</text>
    <rect x="626" y="306" width="300" height="6" fill="#ff1d2e"/>
    <text x="620" y="372" font-size="44" font-weight="700" fill="#8c8c8c">Personal Agentic Process</text>
    <text x="622" y="428" font-size="25" font-weight="400" fill="#8c8c8c">A software process for building with AI agents,</text>
    <text x="622" y="462" font-size="25" font-weight="400" fill="#8c8c8c">and the tooling that enforces and measures it.</text>
  </g>
