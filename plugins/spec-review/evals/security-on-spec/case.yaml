schema_version: "1.1"
name: security-on-spec
description: A named single perspective on a spec fires that perspective, not the board.
tags: [triggering]
runs: 3
execution:
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Give this design spec a security review before I circulate it.

    # Spec: partner usage export

    ## Functional behaviour
    Partners call `GET /export` on the API gateway. The gateway calls the export
    service, which queries the ledger database and returns a CSV of the partner's
    customers' usage for the previous day. Partners authenticate with an API key
    sent in a query parameter.

    ## Non-functional
    - Gateway timeout: 2 seconds. Export service retries the database 3 times.
    - Logs go to the shared log store.

graders:
  - name: security-fires
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?spec-review-security"'
  - name: board-does-not-fire
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?spec-review-full"'
    min: 0
    max: 0
