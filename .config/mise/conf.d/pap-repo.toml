# pap's own tools and tasks, beside the base layer's conf.d/base.toml. This
# file is the repository's, not the template's: pap sync leaves it alone.
# Not pap.toml, which is the name `pap init` gives the pin of pap itself.

[tools]
yq = "4.54.1"

[tasks."test:pap"]
description = "Run the repository test suites"
# Every suite runs, and the task fails at the end naming the ones that
# failed: a run list would stop at the first, and one run should report
# every failure.
run = '''
failed=""
for t in guard-route gen-codeowners assemble change-worktree renovate-copy pap pap-new \
  repo-sync tidy revisits coverage measure release heavy-build session-end agent-token \
  reviewed accept agent-boundary agent-shim-path shell-init plugin-agents pm-mode \
  pm-mode-timing plugin-names plan-step pm-sync cycle-pr-guard release-bump; do
  sh "tests/$t.test.sh" || failed="$failed $t"
done
[ -z "$failed" ] || { echo "test:pap: failed:$failed"; exit 1; }
'''

[tasks.release]
description = "Cut a pap release: mise run release <version> [--dry-run]"
run = "sh scripts/release.sh"

[tasks.release-bump]
description = "Make a pap release bump end to end: mise run release-bump <version> [--route <line 1> <line 2>] [--by <agent> on <model>]"
run = "sh scripts/release-bump.sh"
