schema_version: "1.1"
name: security-report-inline
description: A spec pasted into the prompt comes back with a real security report, not just a triggered skill.
tags: [report]
runs: 2
execution:
  max_turns: 12
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  prompt: |
    Give this design spec a security review before I circulate it.

    # Spec: partner usage export

    ## Functional behaviour
    Partners call `GET /export` on the API gateway. The gateway calls the export
    service, which queries the ledger database and returns a CSV of the partner's
    customers' usage for the previous day. Partners authenticate with an API key
    sent in a query parameter.

    ## Non-functional
    - Gateway timeout: 2 seconds. Export service retries the database 3 times.
    - Logs go to the shared log store.

graders:
  - name: security-fires
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?spec-review-security"'
  - name: verdict-present
    type: regex
    pattern: "Verdict"
    flags: i
  - name: finding-ids-present
    type: regex
    pattern: "SEC-0\\d\\d"
  - name: report-is-real
    type: llm
    criteria: |
      The final message is a security review of the partner usage export design.
      It states a verdict (Pass, Pass with conditions, or Fail), contains a findings
      table, and at least one finding or the verdict concerns the partner API key
      travelling in the URL (query parameter or query string), for example its
      exposure in logs, caches or referrers. A summary that says a review was done
      without showing findings fails.
