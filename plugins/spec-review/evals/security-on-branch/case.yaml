schema_version: "1.1"
name: security-on-branch
description: A security review of code changes must not fire the design-spec security skill.
tags: [triggering]
runs: 3
execution:
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Do a security review of the changes on my current branch before I open the pull request.
graders:
  - name: spec-security-does-not-fire
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?spec-review-security"'
    min: 0
    max: 0
