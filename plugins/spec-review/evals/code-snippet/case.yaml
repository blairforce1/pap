schema_version: "1.1"
name: code-snippet
description: Reviewing code fires no spec-review skill.
tags: [triggering]
runs: 3
execution:
  max_turns: 3
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Review this function for problems.

    ```python
    def export(partner_id, db):
        rows = db.query(f"SELECT * FROM usage WHERE partner = '{partner_id}'")
        return "\n".join(",".join(map(str, r)) for r in rows)
    ```
graders:
  - name: no-spec-review-fires
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?spec-review-'
    min: 0
    max: 0
