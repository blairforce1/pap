# test.yml: runs `mise run test` on every pull request and on main, at the
# repository's own tool pins. It provides the check named "tests", which the
# PAP ruleset requires (decision 0002). `test` runs every task named test:*:
# a language layer defines test:<lang>, and a repository adds its own in its
# own file under .config/mise/conf.d/. With none defined it passes and says
# there is nothing to test.
#
# mise is pinned because jdx/mise-action otherwise installs the latest
# release. .github/renovate.jsonc reads the pin.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    env:
      CI: "true"
      MISE_YES: "1"
      # The repository's own tools, from its own configuration.
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12
      - run: mise run test
