# Base layer: the tools every repository's git hooks run, and the setup,
# check and fmt tasks. mise reads every file in .config/mise/conf.d/, so a
# language layer ships its own file beside this one and nothing is merged
# (decision 0003).
#
# Once per clone: `mise trust && mise install && mise run setup`. `pap init`
# will run that sequence when it exists.
#
# check and fmt run every task named check:* and fmt:*. A language layer adds
# its steps by defining check:<lang> and fmt:<lang> in its own file.

[tools]
lefthook = "2.1.14"
dprint = "0.57.4"
gitleaks = "8.30.1"
shellcheck = "0.11.0"
# ubi, not aqua or github: the aqua entry asks for an asset the release does
# not ship, and the github backend fails its attestation check (mise
# 2026.5.12). ubi is deprecated and removed in mise 2027.1.0; move before then.
"ubi:editorconfig-checker/editorconfig-checker" = "4.0.2"

[tasks.setup]
description = "Install the git hooks and point git blame at the ignore list"
run = [
  "lefthook install",
  "git config blame.ignoreRevsFile .git-blame-ignore-revs",
]

[tasks.check]
description = "Run every check the hooks run, on the whole repository"
# A subtask, not depends: depends stops the siblings at the first failure,
# and one run should report every failure.
run = "mise run --continue-on-error 'check:*'"

[tasks.fmt]
description = "Apply every formatter the hooks check"
run = "mise run --continue-on-error 'fmt:*'"

[tasks."check:dprint"]
run = "dprint check"

[tasks."check:editorconfig"]
run = "editorconfig-checker"

[tasks."check:gitleaks"]
run = "gitleaks git --redact --no-banner"

[tasks."check:shellcheck"]
run = "git ls-files -z '*.sh' | xargs -0 -r shellcheck"

[tasks."fmt:dprint"]
run = "dprint fmt"
